<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Mi Gym</title>
<style>
:root{--bg:#0E0E10;--card:#17171A;--elev:#222226;--bd:#2E2E33;--tx:#F4F4F5;--mu:#A1A1AA;--ac:#5AC8FA;--red:#FF453A;--ok:#34C759;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:88px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:34px;line-height:1.1;margin:8px 0 16px;font-weight:800;letter-spacing:-.02em}
.mu{color:var(--mu)}.mt{margin-top:16px}.gap{height:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#0E0E10;font:700 17px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
.btn.sec{background:var(--elev);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--mu);font-weight:600}
.btn.sm{min-height:44px;font-size:15px;margin-top:6px}
.btn:active{opacity:.8}
.x{background:none;border:0;color:var(--red);font:600 15px inherit;font-family:inherit;min-height:44px;padding:0 4px;cursor:pointer}
.chip{background:var(--elev);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:600}
.sr{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.sr.hd{color:var(--mu);font-size:13px;margin-top:10px}
.sr.hd span{text-align:center}
.sr input{width:100%;height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:700 22px inherit;font-family:inherit;font-variant-numeric:tabular-nums;text-align:center;min-width:0}
.sr input::placeholder{color:#6b6b73;font-weight:500}
.sr input:focus,.ck:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ck{height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--mu);font-size:22px;cursor:pointer}
.sr.done .ck{background:var(--ac);border-color:var(--ac);color:#0E0E10}
.sr.done input{border-color:var(--ac)}
.hl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.hl span:last-child{text-align:right}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(23,23,26,.96);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--mu);font:600 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
#sheet.on{display:flex}
.pane{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:82vh;display:flex;flex-direction:column}
.pane input{height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:17px inherit;font-family:inherit;padding:0 14px;margin:10px 0}
#ql{overflow:auto;-webkit-overflow-scrolling:touch}
.li{display:flex;justify-content:space-between;gap:12px;width:100%;min-height:48px;align-items:center;background:none;border:0;border-top:1px solid var(--bd);color:var(--tx);font:17px inherit;font-family:inherit;text-align:left;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--elev);border:1px solid var(--bd);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.on{opacity:1}
.btn,.x,.sr input,nav button,.pane input,.li,#bw,#sx{font-family:inherit}
.btn{font-size:17px;font-weight:700}.x{font-size:15px;font-weight:600}.sr input{font-size:22px;font-weight:700}nav button{font-size:12px;font-weight:600}.pane input,.li{font-size:17px}textarea{font-size:16px}
#bw,#ht,#sx,#gn,#un,#gl,#em,#pw{font-family:inherit;display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font-size:17px;padding:0 14px;margin-top:10px}
.bar{height:8px;background:var(--elev);border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%}
.bd{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:99px;background:var(--elev);font-size:13px;font-weight:600}
.av{display:block;width:112px;height:112px;border-radius:50%;object-fit:cover;margin:4px auto 10px;background:#000;border:2px solid var(--bd)}
.group-member{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.group-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;object-fit:cover;background:var(--elev);border:2px solid var(--bd)}
.group-member-info{flex:1;min-width:0}
.timer-value{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.finish-time{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:18px 0}
.hist-duration{display:flex;justify-content:space-between;gap:12px;color:var(--mu);font-size:14px;margin:10px 0}
.hist-select{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:inherit;padding:0 12px;margin:8px 0}
.he-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 20px}
.sr.bar-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 52px}
.he-row.bar-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 20px}
.bar-hidden{display:none!important}
.bar-weight-note{margin:8px 0 0;font-size:13px}
.rank-display{display:inline-flex;align-items:center;gap:7px}
.rank-badge{display:inline-flex;width:36px;height:36px;flex:0 0 36px;vertical-align:middle}
.rank-badge svg{display:block;width:100%;height:100%}
.rank-list-badge{width:32px;height:32px;flex-basis:32px}
#pdp{display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:17px inherit;font-family:inherit;padding:0 14px;margin-top:10px}
.hid{position:absolute;left:-9999px;width:1px;height:1px}
summary{min-height:44px;font-weight:600;cursor:pointer;display:flex;align-items:center}
.gh{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;font:inherit;padding:0;min-height:44px;cursor:pointer}
svg [data-a]{cursor:pointer}
#ql .li:active{background:var(--elev)}

/* Ficha visual de ejercicios */
.ex-preview{background:#080809;border:1px solid #34343a;border-radius:16px;padding:14px;margin:10px 0 14px;color:#f4f4f5}
.ex-preview .figure{display:block;width:100%;max-height:245px;margin:0 auto;background:#f3f3f4;border:1px solid #dedee2;border-radius:12px}
.ex-preview .movement{display:flex;align-items:center;gap:7px;color:#bdbdc6;font-size:13px;margin-top:8px}
.ex-preview .movement i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5148}
.anatomy-panel{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:9px;align-items:stretch;margin:12px 0}
.anatomy-views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.anatomy-card{margin:0;overflow:hidden;border:1px solid #dedee2;border-radius:12px;background:#f3f3f4}
.anatomy-map{display:block;width:100%;height:160px}
.anatomy-card figcaption{padding:7px 8px 9px;text-align:center;background:#242428;color:#fff;font-size:13px;font-weight:700}
.muscle-legend{align-self:center;padding:10px 8px;border:1px solid #3b3b42;border-radius:12px;background:#202024}
.muscle-legend>b{display:block;margin:0 0 8px;font-size:13px}
.muscle-rank{display:grid;grid-template-columns:13px 1fr;gap:6px;align-items:start;margin:8px 0}
.muscle-rank i{width:11px;height:11px;border-radius:50%;margin-top:3px}
.muscle-rank span{display:block;color:#fff;font-size:12px;line-height:1.2}
.muscle-rank small{display:block;color:#bdbdc6;font-size:10px;margin-top:2px;line-height:1.2}
.muscle-legend .hint{font-size:10px;line-height:1.25;margin:8px 0 0}
@media(max-width:360px){.anatomy-panel{grid-template-columns:minmax(0,1fr) 94px;gap:6px}.anatomy-map{height:145px}.muscle-legend{padding:8px 6px}}
.ex-preview h2{font-size:22px;margin:10px 0 5px}
.ex-preview p{margin:7px 0;color:#c4c4cc;font-size:15px}
.ex-preview .muscles{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.ex-preview .muscles span{background:#28282e;border:1px solid #41414a;border-radius:99px;padding:5px 10px;font-size:13px;color:#fff}
.ex-preview .hint{color:#9b9ba5;font-size:13px}
.ex-preview .btn{margin-top:10px}
.acc-h{margin-bottom:8px}.acc-h .gh{min-height:48px;font-size:18px}.acc-b{margin-bottom:8px}
.streak{font-size:18px;margin:4px 0 2px}.streak .big{font-size:42px;color:var(--ac);line-height:1;margin-right:6px}
.wgrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.wgb{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.wgb.on{background:var(--ac);color:#0E0E10;border-color:var(--ac)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.calnav b{text-transform:capitalize;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px}
.cal .hd{aspect-ratio:auto;color:var(--mu);font-size:12px;font-weight:600}
.cal .tr{background:var(--ac);color:#0E0E10;font-weight:700}
.cal .td{outline:2px solid var(--tx);outline-offset:-2px}
</style>

<style>#sp{position:fixed;inset:0;z-index:99;background:#0E0E10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}#sp b{color:#fff;font:700 28px -apple-system,system-ui,sans-serif;letter-spacing:.5px}#sp.o{opacity:0;pointer-events:none}</style>
<style>
:root{--ac:#27B8FF}
body{background:radial-gradient(120% 55% at 50% -8%,#14222d 0,rgba(14,14,16,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 16px),#0E0E10}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.brand img{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd)}
.brand b{font-size:15px;font-weight:900;font-style:italic;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
h1{font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
h1::after{content:"";display:block;width:56px;height:5px;margin-top:8px;border-radius:3px;background:var(--ac);transform:skewX(-20deg)}
.card{border-left:4px solid var(--ac);border-radius:14px;background:linear-gradient(180deg,#1c1c20,#151518)}
.btn{background:linear-gradient(135deg,#43CBFF,#1C97DE);text-transform:uppercase;letter-spacing:.07em;font-weight:900;font-style:italic;box-shadow:0 6px 18px rgba(39,184,255,.22)}
.btn.sec{background:var(--elev);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.btn.ghost{background:transparent;color:var(--mu);box-shadow:none;text-transform:none;font-style:normal;letter-spacing:0;font-weight:600}
.btn.sm{letter-spacing:.04em}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:none}
nav{background:rgba(14,14,16,.97);border-top:1px solid #26262b}
nav button{position:relative;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
nav button.on{color:var(--ac);text-shadow:0 0 12px rgba(39,184,255,.55)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(39,184,255,.7))}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
#sp b{font-style:italic;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:26px}
#sp img{animation:pl 1.2s ease-in-out infinite alternate}
@keyframes pl{from{transform:scale(.96)}to{transform:scale(1.04)}}
.achievements-card h2{margin:0 0 8px;font-size:22px}
.achievements-intro{font-size:13px;line-height:1.45;margin:0 0 10px}
.ach-group{border-top:1px solid var(--bd)}
.ach-group:first-of-type{border-top:0}
.ach-group .gh{min-height:50px}
.ach-count{color:var(--mu);font-size:13px}
.ach-item{margin:6px 0 12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.025)}
.ach-item h3{font-size:16px;margin:0}
.ach-status{color:var(--mu);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ach-status.up{color:#34c759}
.ach-status.same{color:#ffd60a}
.ach-performance{margin:9px 0;color:var(--mu);font-size:13px;line-height:1.6}
.ach-performance b{color:var(--tx)}
.ach-rank{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd);padding-top:8px;font-size:13px}
.ach-rank span{color:var(--mu)}
.ach-empty{font-size:13px;margin:4px 0 12px}
</style>
<style>
nav button{font-size:9.5px;letter-spacing:0;text-transform:none;padding:0 1px;min-width:0;white-space:nowrap}
nav button svg{width:22px;height:22px}
.sr.he-head,.sr.he-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 40px}
.sr.he-head.bar-row,.sr.he-row.bar-row{grid-template-columns:28px repeat(3,minmax(0,1fr)) 40px}
.he-rm{padding:0;font-size:24px;line-height:1;text-align:center}
.hist-uni{display:flex;align-items:center;gap:10px;min-height:44px;margin:4px 0}
.hist-uni input{width:22px;height:22px;accent-color:var(--ac)}
#ag,#ngoal,#nact,#nmeals,#ndiet,#supn,#supd{font-family:inherit;display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font-size:17px;padding:0 14px;margin-top:10px}
#ngoal,#nact,#nmeals,#ndiet{padding:0 10px;margin-top:6px}
.nut-l{display:block;margin-top:14px;font-size:14px;color:var(--mu);font-weight:600}
.nut-kcal{font-size:46px;font-weight:900;font-style:italic;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0}
.nut-kcal small{font-size:18px;font-weight:700;color:var(--mu);font-style:normal}
.nut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.nut-m{background:var(--elev);border-radius:12px;padding:10px 6px;text-align:center}
.nut-m i{display:block;height:4px;border-radius:2px;margin-bottom:8px}
.nut-m b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.nut-m span{display:block;font-size:13px;font-weight:700}
.nut-m small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.bar.stack{display:flex}.bar.stack i{height:100%}
.nut-note{font-size:13px;line-height:1.45;margin:10px 0 0;color:var(--mu)}
.nut-warn{font-size:14px;line-height:1.4;margin:10px 0 0;color:#FFD60A}
.nut-tip{margin:8px 0 0;font-size:15px;line-height:1.4}
details .hl{align-items:flex-start}
.supq{min-height:44px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);border-radius:99px;padding:0 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;margin:6px 6px 0 0}
.sup-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bd);margin-top:8px}
.sup-ck{width:52px;flex:0 0 52px}
.sup-ck.on{background:var(--ac);border-color:var(--ac);color:#0E0E10}
.sup-card.pend{border-left-color:#FFD60A}
.sup-card.ok{border-left-color:var(--ok)}
.sup-note{margin:8px 0 0;font-size:13px}
</style>
<style>
.dots{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:700 22px/1 inherit;font-family:inherit;cursor:pointer;padding:0 0 4px}
.dots:active{opacity:.8}
.rt-item{padding:12px 0;border-top:1px solid var(--bd)}
.rt-btns{display:flex;align-items:center;gap:8px}
.rt-btns .btn{width:auto;flex:1}
.rt-row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:48px;border-top:1px solid var(--bd)}
.rt-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.rt-mv{display:flex;align-items:center;flex:0 0 auto}
.rtb{min-width:40px;min-height:44px;background:none;border:0;color:var(--mu);font:700 18px inherit;font-family:inherit;cursor:pointer}
.rt-go{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;text-transform:none;font-style:normal;letter-spacing:0;text-align:left}
.rt-go span:first-child{min-width:0;overflow-wrap:anywhere}
.supq.on{background:var(--ac);color:#0E0E10;border-color:var(--ac)}
.prg{padding:4px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--bd)}
.prg-svg{display:block;width:100%;height:auto;margin-top:10px}
.prg-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.prg-st div{background:var(--elev);border-radius:10px;padding:8px 4px;text-align:center}
.prg-st span{display:block;font-size:11px}
.prg-st b{display:block;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
</style>

<script>

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S.workouts=d.workouts||[];S.custom=d.custom||[];S.cur=d.cur||null;S.bw=num(d.bw);S.sex=d.sex==='m'?'m':'h';S.h=num(d.h);S.cg=d.cg||{};S.fl=d.fl||{};S.grp=d.grp||null;S.uid=d.uid||'';S.un=d.un||'';S.pf=d.pf||null;S.ph=d.ph||'';S.nu=d.nu&&typeof d.nu==='object'?d.nu:{};S.sup=Array.isArray(d.sup)?d.sup:[];S.sl=d.sl&&typeof d.sl==='object'?d.sl:{};S.rt=Array.isArray(d.rt)?d.rt:[];S.wg=Math.min(7,Math.max(0,Math.floor(num(d.wg))))}}catch(e){store=false}if(!S.uid)S.uid=rid()}

 if(!S.cur){const l=S.workouts[0];

function histEdit(w,i,e){

const usesBar=n=>BAR_EXERCISES.has(n)||/barra/i.test(n),loadKg=(e,s,m=1)=>num(s.w)*m+(usesBar(e.n)?num(s.bw):0);
const K={'Press banca':1.25,'Press banca inclinado':1,'Aperturas con mancuernas':.2,'Fondos en paralelas':1.5,'Dominadas':1.3,'Remo con barra':1,'Jalón al pecho':.95,'Remo en polea':.95,'Peso muerto':1.75,'Press militar':.8,'Elevaciones laterales':.1,'Pájaros':.1,'Curl de bíceps':.5,'Curl martillo':.45,'Extensión de tríceps':.5,'Press francés':.5,'Sentadilla':1.5,'Prensa':3,'Zancadas':.9,'Peso muerto rumano':1.4,'Curl femoral':.6,'Extensión de cuádriceps':.9,'Hip thrust':1.75,'Elevación de talones':1.6,'Crunch en polea':.8};
function lvl(n){const k=K[n];if(!k||!S.bw)return null;let best=0;for(const w of S.workouts){const e=w.ex.find(x=>x.n===n);if(e)for(const s of e.sets){const ld=(BWL.includes(n)?S.bw:0)+loadKg(e,s,e.uni?2:1),e1=ld*(1+Math.min(s.r,12)/30);if(e1>best)best=e1}}if(!best)return null;return Math.max(0,Math.min(30,9+Math.log(best/S.bw/(k*(S.sex==='m'?.65:1)))/Math.log(1.07)))}

function nutriCalc(){
 const n=S.nu||{},w=num(S.bw),h=num(S.h),a=num(n.age),act=num(n.act);
 if(!w||!h||!a||!n.goal||!act)return null;
 if(a<14||a>90||h<120||h>230||w<30||w>250)return{bad:true};
 const hm=h/100,bmi=w/(hm*hm),bmr=10*w+6.25*h-5*a+(S.sex==='m'?-161:5),tdee=bmr*act,notes=[];
 let goal=n.goal;
 if(goal==='cut'&&a<18){goal='keep';notes.push('Con menos de 18 años no recomiendo una dieta para bajar de peso sin que la supervise un médico o dietista. Te muestro mantenimiento.')}
 else if(goal==='cut'&&bmi<20){goal='keep';notes.push('Tu IMC es bajo ('+fx(bmi)+'), así que bajar de peso no tiene sentido. Te muestro mantenimiento.')}
 let kcal=tdee;
 if(goal==='cut'){kcal=tdee-Math.min(tdee*.2,750);const fl=S.sex==='m'?1200:1500;if(kcal<fl){kcal=Math.min(fl,tdee);notes.push('He puesto un mínimo de '+fl+' kcal por seguridad.')}}

 else if(goal==='bulk')kcal=tdee+Math.min(Math.max(tdee*.18,350),600);
 kcal=Math.round(kcal/10)*10;
 const refW=Math.min(w,27*hm*hm),pk={cut:2.1,keep:1.8,lean:1.9,bulk:1.8}[goal];
 const p=Math.round(refW*pk),f=Math.round(Math.max(.8*refW,.25*kcal/9)),c=Math.max(0,Math.round((kcal-4*p-9*f)/4)),t=Math.round(tdee/10)*10,diff=kcal-t;
 return{goal,kcal,tdee:t,diff,weekly:diff*7/7700,p,c,f,pk,refW,fiber:Math.round(kcal/1000*14),water:w*.035,notes,bmi};
}
function nutriLine(label,target,list,k){

 const L=list.map((_,q)=>list[(k+q)%list.length]),opts=[];
 L.forEach(it=>{if(opts.length<3){const r=amt(it,target);if(r.ok)opts.push(r.txt)}});

function nutriResult(){
 const r=nutriCalc();
 if(!r)return '<section class="card"><b>Tu plan</b><p class="mu">Rellena peso, altura y edad, y elige tu objetivo y tu actividad. Aquí te saldrá cuánto comer cada día.</p></section>';
 if(r.bad)return '<section class="card"><b>Revisa tus datos</b><p class="mu">La edad debe estar entre 14 y 90 años, la altura entre 120 y 230 cm y el peso entre 30 y 250 kg.</p></section>';
 const n=S.nu||{},diet=PROT[n.diet]?n.diet:'omni',nm=MEALS[num(n.meals)]?num(n.meals):4,meals=MEALS[nm];
 const pk=Math.round(r.p*4/r.kcal*100),fk=Math.round(r.f*9/r.kcal*100),ck=Math.max(0,100-pk-fk);
 const adj=r.diff===0?'Es tu mantenimiento: ni subes ni bajas.':(r.diff>0?'+':'−')+Math.abs(r.diff)+' kcal sobre tu mantenimiento ('+r.tdee+' kcal), unos '+(r.diff>0?'+':'−')+fx(Math.abs(r.weekly))+' kg por semana.';
 const GN={cut:'Perder grasa',keep:'Mantener',lean:'Volumen limpio',bulk:'Volumen fuerte'}[r.goal];
 let h='<section class="card"><div class="mu">'+GN+' · tu objetivo diario</div><div class="nut-kcal">'+r.kcal+' <small>kcal</small></div><p class="mu" style="margin:4px 0 0">'+adj+'</p>'+
  r.notes.map(t=>'<p class="nut-warn">'+esc(t)+'</p>').join('')+
  '<div class="bar stack" role="img" aria-label="Reparto de calorías: '+pk+' % proteína, '+ck+' % hidratos, '+fk+' % grasas"><i style="width:'+pk+'%;background:#27B8FF"></i><i style="width:'+ck+'%;background:#FFD60A"></i><i style="width:'+fk+'%;background:#FF9F6B"></i></div>'+
  '<div class="nut-grid"><div class="nut-m"><i style="background:#27B8FF"></i><b>'+r.p+' g</b><span>Proteína</span><small>'+fx(r.p/r.refW)+' g/kg · '+pk+' %</small></div><div class="nut-m"><i style="background:#FFD60A"></i><b>'+r.c+' g</b><span>Hidratos</span><small>'+fx(r.c/num(S.bw))+' g/kg · '+ck+' %</small></div><div class="nut-m"><i style="background:#FF9F6B"></i><b>'+r.f+' g</b><span>Grasas</span><small>'+fx(r.f/num(S.bw))+' g/kg · '+fk+' %</small></div></div>'+
  '<p class="nut-note">Fibra: al menos '+r.fiber+' g · Agua: unos '+fx(r.water)+' L al día, y algo más los días que entrenes.</p></section>';
 h+='<section class="card"><b>Reparto en '+nm+' comidas</b><p class="mu" style="margin:4px 0 0;font-size:14px">Toca una comida para ver cuánta cantidad de cada alimento necesitas. Puedes cambiar unos por otros.</p>';
 meals.forEach((m,k)=>{
  const fr=m[1],p=r.p*fr,c=r.c*fr,f=r.f*fr,main=m[0]==='Comida'||m[0]==='Cena';
  h+='<details><summary>'+m[0]+' · '+Math.round(r.kcal*fr/10)*10+' kcal</summary><p class="mu" style="margin:0 0 6px;font-size:14px">Proteína '+Math.round(p)+' g · Hidratos '+Math.round(c)+' g · Grasas '+Math.round(f)+' g</p>'+
   nutriLine('Proteína',p,PROT[diet][main?'main':'light'],k)+nutriLine('Hidratos',c,CARB[main?'main':'light'],k)+nutriLine('Grasas',f,FATF,k)+'</details>';
 });
 h+='<p class="nut-note">Las cantidades son aproximadas: cada alimento aporta un poco de los otros nutrientes. Los días que entrenes, mete más hidratos en la comida de antes y de después.</p></section>';
 const tips={cut:['Pésate 2–3 veces por semana por la mañana y mira la media semanal, no un día suelto.','Lo normal es perder entre 0,25 y 0,75 kg por semana. Si pierdes más rápido, sube 100–200 kcal para proteger el músculo.','Mantén la proteína alta y sigue entrenando fuerte: es lo que conserva tu músculo.'],
  keep:['Pésate cada pocos días y fíjate en la tendencia. Si cambia de forma sostenida durante 2 semanas, ajusta 100–150 kcal.','Reparte la proteína en todas las comidas.'],
  lean:['Apunta a subir unos 0,25 kg por semana. Si en 2–3 semanas tu peso medio no sube, añade 150 kcal, sobre todo de hidratos.','Subir despacio da más músculo y menos grasa.'],
  bulk:['Puedes subir hasta ~0,5 kg por semana. Más rápido que eso suele ser sobre todo grasa.','Si te cuesta comer tanto, reparte en 5 comidas, bebe calorías (leche con avena y plátano) y añade aceite de oliva o frutos secos a los platos.','Apóyate en comida de verdad (arroz, pasta, patata, carne, huevos, legumbres, fruta) y no te pases con los ultraprocesados.','Si tras 2 semanas no subes nada, suma 200–300 kcal.']}[r.goal];
 if(diet==='vegan')tips.push('Si eres vegana o vegano, necesitas suplementar vitamina B12.');
 h+='<section class="card"><b>Consejos para tu objetivo</b>'+tips.map(t=>'<p class="nut-tip">• '+esc(t)+'</p>').join('')+'</section>';
 h+='<p class="nut-note" style="padding:0 4px 8px">Es una estimación orientativa (fórmula de Mifflin-St Jeor), no un plan médico. Si tienes alguna condición de salud, estás embarazada, tienes o has tenido un trastorno de la conducta alimentaria o eres menor de edad, consúltalo con un médico o dietista.</p>';
 return h;
}

/* ===== GRÁFICA DE PROGRESO (dentro de Logros) ===== */
const PRGM=[['e1','Fuerza estimada'],['w','Peso máximo'],['v','Volumen']];
function prgNames(){const c={};for(const w of S.workouts)for(const e of w.ex||[])if(e.n&&(e.sets||[]).some(s=>num(s.r)>0))c[e.n]=(c[e.n]||0)+1;return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,'es')).map(n=>[n,c[n]])}
function prgSeries(name,m){const out=[];for(const w of S.workouts.slice().sort((a,b)=>num(a.date)-num(b.date))){const es=(w.ex||[]).filter(e=>e.n===name);if(!es.length)continue;let v=0;
 for(const e of es){if(m==='e1'){const p=workoutBestPerformance(w,e);if(p)v=Math.max(v,p.score)}else if(m==='w'){for(const s of e.sets||[])if(num(s.r)>0)v=Math.max(v,loadKg(e,s))}else{for(const s of e.sets||[])if(num(s.r)>0)v+=loadKg(e,s)*num(s.r)}}
 if(v>0)out.push({d:num(w.date),v})}return out.slice(-40)}
function prgChart(pts,unit){
 const W=320,H=190,l=44,r=14,t=14,bt=28,pw=W-l-r,ph=H-t-bt;let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
 if(hi-lo<1e-6){lo-=1;hi+=1}else{const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad}
 const X=i=>l+(pts.length===1?pw/2:i*pw/(pts.length-1)),Y=v=>t+ph-(v-lo)/(hi-lo)*ph,fv=v=>v>=100?String(Math.round(v)):fx(v,1),
  dl=ts=>new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
 let g='';for(let k=0;k<3;k++){const v=lo+(hi-lo)*k/2,y=Y(v);g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="#2E2E33" stroke-width="1"/><text x="'+(l-6)+'" y="'+(y+4)+'" text-anchor="end" fill="#A1A1AA" font-size="11">'+fv(v)+'</text>'}
 const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
 const area=pts.length>1?'<path d="'+line+'L'+X(pts.length-1).toFixed(1)+' '+(t+ph)+'L'+X(0).toFixed(1)+' '+(t+ph)+'Z" fill="#27B8FF" opacity=".12"/>':'';
 const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?5:3.5)+'" fill="'+(i===pts.length-1?'#27B8FF':'#0E0E10')+'" stroke="#27B8FF" stroke-width="2"><title>'+dl(p.d)+': '+fv(p.v)+' '+unit+'</title></circle>').join('');
 return '<svg class="prg-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfica de progreso: de '+fv(pts[0].v)+' a '+fv(pts[pts.length-1].v)+' '+unit+' en '+pts.length+' entrenos">'+g+area+(pts.length>1?'<path d="'+line+'" fill="none" stroke="#27B8FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+dots+
  '<text x="'+l+'" y="'+(H-8)+'" text-anchor="start" fill="#A1A1AA" font-size="11">'+dl(pts[0].d)+'</text>'+(pts.length>1?'<text x="'+(W-r)+'" y="'+(H-8)+'" text-anchor="end" fill="#A1A1AA" font-size="11">'+dl(pts[pts.length-1].d)+'</text>':'')+'</svg>';
}
function vProgress(){
 const names=prgNames();
 if(!names.length)return '<div id="prg" class="prg"><h3 style="margin:0 0 6px;font-size:17px">Gráfica de progreso</h3><p class="mu ach-empty">Termina algún entrenamiento y aquí verás cómo evoluciona cada ejercicio.</p></div>';
 if(!E.prgEx||!names.some(x=>x[0]===E.prgEx))E.prgEx=names[0][0];
 const m=E.prgM||'e1',unit=m==='v'?'kg movidos':'kg',pts=prgSeries(E.prgEx,m);
 let body;
 if(!pts.length)body='<p class="mu ach-empty">Este ejercicio no tiene peso añadido, así que no hay nada que dibujar con esta medida. Prueba con «Fuerza estimada».</p>';
 else{const f=pts[0].v,la=pts[pts.length-1].v,best=Math.max(...pts.map(p=>p.v)),ch=la-f,pc=f>0?ch/f*100:0,fv=v=>v>=100?String(Math.round(v)):fx(v,1);
  body=prgChart(pts,unit)+(pts.length<2?'<p class="mu ach-empty">Con un entreno más ya verás la línea de progreso.</p>':'')+'<div class="prg-st"><div><span class="mu">Primero</span><b>'+fv(f)+'</b></div><div><span class="mu">Último</span><b>'+fv(la)+'</b></div><div><span class="mu">Mejor</span><b>'+fv(best)+'</b></div><div><span class="mu">Cambio</span><b style="color:'+(ch>0?'#34C759':ch<0?'#FF453A':'inherit')+'">'+(ch>0?'+':ch<0?'−':'')+fv(Math.abs(ch))+(f>0&&pts.length>1?' ('+(ch>0?'+':ch<0?'−':'')+Math.abs(Math.round(pc))+' %)':'')+'</b></div></div>'+
   (m==='e1'?'<p class="nut-note" style="margin-top:6px">Fuerza estimada: el peso máximo que podrías mover una vez, calculado con tu mejor serie de cada entreno.</p>':'')}
 return '<div id="prg" class="prg"><h3 style="margin:0 0 6px;font-size:17px">Gráfica de progreso</h3><select id="prg-ex" class="hist-select" aria-label="Ejercicio">'+names.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===E.prgEx?' selected':'')+'>'+esc(x[0])+' ('+x[1]+(x[1]===1?' entreno':' entrenos')+')</option>').join('')+'</select><div>'+PRGM.map(x=>'<button class="supq'+(x[0]===m?' on':'')+'" data-a="prgm" data-m="'+x[0]+'" aria-pressed="'+(x[0]===m?'true':'false')+'">'+x[1]+'</button>').join('')+'</div>'+body+'</div>';
}
function prgRefresh(){const el=$('#prg');if(el)el.outerHTML=vProgress()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='prgm'){E.prgM=b.dataset.m;prgRefresh()}
 else if(a==='prgsel'){E.prgEx=b.dataset.n;render();const el=$('#prg');if(el)el.scrollIntoView({block:'start',behavior:'smooth'})}
});
document.addEventListener('change',ev=>{if(ev.target.id==='prg-ex'){E.prgEx=ev.target.value;prgRefresh()}});

/* ===== FOTO DE COMIDA (análisis con IA) ===== */
const FOOD_API='/api/analyze'; /* URL de tu proxy (ver food-proxy.js). Vacío = función desactivada */
function foodToday(){S.fl=S.fl||{};return S.fl[dkey()]||[]}
function foodTotals(){const t={kcal:0,p:0,c:0,f:0};for(const x of foodToday()){t.kcal+=x.kcal;t.p+=x.p;t.c+=x.c;t.f+=x.f}return t}
function foodVerdict(m){
 const r=nutriCalc();if(!r||r.bad)return{lv:'mu',t:'Rellena tu plan arriba (peso, altura, edad y objetivo) para saber si te conviene.',w:[]};
 const nm=MEALS[num((S.nu||{}).meals)]?num(S.nu.meals):4,tg=r.kcal/nm,tot=foodTotals(),left=r.kcal-tot.kcal,w=[];
 if(m.p<r.p/nm*.6)w.push('Lleva poca proteína para una comida de tu plan (~'+Math.round(r.p/nm)+' g).');
 if(m.f>r.f/nm*1.5)w.push('Es alta en grasas ('+Math.round(m.f)+' g).');
 if(r.goal==='cut'&&m.kcal>tg*1.15)w.push('Para perder grasa, mejor una ración más pequeña.');
 if(m.kcal>left)return{lv:'bad',t:'Evítala hoy: te pasarías de tus calorías (te quedan '+Math.max(0,Math.round(left))+' kcal).',w};
 if(m.kcal>tg*1.4||w.length>=2)return{lv:'mid',t:'Con cuidado: cómela en menos cantidad o compénsala en las otras comidas.',w};
 return{lv:'ok',t:'Encaja con tu plan. Puedes comerla.',w};
}
function foodImg(file){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>ko();im.src=u})}
function vFood(){
 const F=E.food||{},r=nutriCalc(),tot=foodTotals();
 let h='<section class="card" id="food"><b>Analiza tu comida con una foto</b><p class="mu" style="margin:6px 0 0">Haz una foto a tu plato y te digo calorías, macros y si encaja con tu plan.</p>'+
  '<input type="file" id="fphoto" class="hid" accept="image/*" capture="environment"><button class="btn" data-a="foodcam"'+(F.load?' disabled':'')+'>'+(F.load?'Analizando…':'📷 Hacer foto a la comida')+'</button>';
 if(r&&!r.bad)h+='<div class="bar"><i style="width:'+Math.min(100,tot.kcal/r.kcal*100)+'%;background:#27B8FF"></i></div><p class="nut-note">Hoy llevas '+Math.round(tot.kcal)+' de '+r.kcal+' kcal · P '+Math.round(tot.p)+'/'+r.p+' g · H '+Math.round(tot.c)+'/'+r.c+' g · G '+Math.round(tot.f)+'/'+r.f+' g</p>';
 if(F.err)h+='<p class="nut-warn">'+esc(F.err)+'</p>';
 if(F.res){const m=F.res,v=foodVerdict(m),col={ok:'#34C759',mid:'#FFD60A',bad:'#FF453A',mu:'#A1A1AA'}[v.lv];
  h+='<div class="mt"><b>'+esc(m.name)+'</b><div class="nut-kcal">'+Math.round(m.kcal)+' <small>kcal</small></div><div class="nut-grid"><div class="nut-m"><b>'+fx(m.p,0)+' g</b><span>Proteína</span></div><div class="nut-m"><b>'+fx(m.c,0)+' g</b><span>Hidratos</span></div><div class="nut-m"><b>'+fx(m.f,0)+' g</b><span>Grasas</span></div></div>'+
   (m.fiber?'<p class="nut-note">Fibra: '+fx(m.fiber,0)+' g'+(m.sugar?' · Azúcares: '+fx(m.sugar,0)+' g':'')+'</p>':'')+
   (m.items.length?'<p class="nut-note">Detectado: '+m.items.map(esc).join(', ')+'</p>':'')+
   '<p style="margin:12px 0 0;font-weight:700;color:'+col+'">'+esc(v.t)+'</p>'+v.w.map(t=>'<p class="nut-tip">• '+esc(t)+'</p>').join('')+
   '<p class="nut-note">Estimación aproximada a partir de la foto.</p><button class="btn sec sm" data-a="foodadd">Añadir a mi día</button></div>'}
 return h+'</section>';
}
function foodRefresh(){const el=$('#food');if(el)el.outerHTML=vFood()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='foodcam'){if(!FOOD_API){E.food={err:'Falta configurar el proxy de IA (FOOD_API en el código).'};foodRefresh();return}const f=$('#fphoto');if(f)f.click()}
 else if(a==='foodadd'&&E.food&&E.food.res){const m=E.food.res;S.fl=S.fl||{};(S.fl[dkey()]=S.fl[dkey()]||[]).push({n:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f});const ks=Object.keys(S.fl).sort();while(ks.length>14)delete S.fl[ks.shift()];E.food={};save();toast('Añadido a tu día');foodRefresh()}
});
document.addEventListener('change',async ev=>{if(ev.target.id!=='fphoto'||!ev.target.files[0])return;const file=ev.target.files[0];
 E.food={load:1};foodRefresh();
 try{const r=nutriCalc(),img=await foodImg(file),res=await fetch(FOOD_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:img,media_type:'image/jpeg'})});
  if(!res.ok)throw 0;const d=await res.json(),n=x=>Math.max(0,Number(x)||0);
  if(!d||d.error||!d.name||!n(d.kcal))throw 0;
  E.food={res:{name:String(d.name).slice(0,80),kcal:n(d.kcal),p:n(d.protein),c:n(d.carbs),f:n(d.fat),fiber:n(d.fiber),sugar:n(d.sugar),items:Array.isArray(d.items)?d.items.slice(0,8).map(String):[]}}}
 catch(e){E.food={err:'No pude analizar la foto. Prueba con mejor luz o revisa tu conexión.'}}
 foodRefresh()});

const hm=location.hash.match(/g=([a-z0-9]+)/);if(hm){E.inv=hm[1];view='grp'}
setTimeout(()=>$("#sp").classList.add("o"),900);
load();if(A)S.uid=A.u;render();if(A&&online()&&!S.workouts.length&&!S.grp)cload().then(render);if(view==='grp')gload();
</script>
