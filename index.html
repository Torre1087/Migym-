<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Mi Gym</title>
<style>
:root{--bg:#0E0E10;--card:#17171A;--elev:#222226;--bd:#2E2E33;--tx:#F4F4F5;--mu:#A1A1AA;--ac:#5AC8FA;--red:#FF453A;--ok:#34C759;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:88px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:34px;line-height:1.1;margin:8px 0 16px;font-weight:800;letter-spacing:-.02em}
.mu{color:var(--mu)}.mt{margin-top:16px}.gap{height:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#0E0E10;font:700 17px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
.btn.sec{background:var(--elev);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--mu);font-weight:600}
.btn.sm{min-height:44px;font-size:15px;margin-top:6px}
.btn:active{opacity:.8}
.x{background:none;border:0;color:var(--red);font:600 15px inherit;font-family:inherit;min-height:44px;padding:0 4px;cursor:pointer}
.chip{background:var(--elev);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:600}
.sr{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.sr.hd{color:var(--mu);font-size:13px;margin-top:10px}
.sr.hd span{text-align:center}
.sr input{width:100%;height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:700 22px inherit;font-family:inherit;font-variant-numeric:tabular-nums;text-align:center;min-width:0}
.sr input::placeholder{color:#6b6b73;font-weight:500}
.sr input:focus,.ck:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ck{height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--mu);font-size:22px;cursor:pointer}
.sr.done .ck{background:var(--ac);border-color:var(--ac);color:#0E0E10}
.sr.done input{border-color:var(--ac)}
.hl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.hl span:last-child{text-align:right}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(23,23,26,.96);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--mu);font:600 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
#sheet.on{display:flex}
.pane{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:82vh;display:flex;flex-direction:column}
.pane input{height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:17px inherit;font-family:inherit;padding:0 14px;margin:10px 0}
#ql{overflow:auto;-webkit-overflow-scrolling:touch}
.li{display:flex;justify-content:space-between;gap:12px;width:100%;min-height:48px;align-items:center;background:none;border:0;border-top:1px solid var(--bd);color:var(--tx);font:17px inherit;font-family:inherit;text-align:left;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--elev);border:1px solid var(--bd);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.on{opacity:1}
.btn,.x,.sr input,nav button,.pane input,.li,#bw,#sx{font-family:inherit}
.btn{font-size:17px;font-weight:700}.x{font-size:15px;font-weight:600}.sr input{font-size:22px;font-weight:700}nav button{font-size:12px;font-weight:600}.pane input,.li{font-size:17px}textarea{font-size:16px}
#bw,#ht,#sx,#gn,#un,#gl,#em,#pw{font-family:inherit;display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font-size:17px;padding:0 14px;margin-top:10px}
.bar{height:8px;background:var(--elev);border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%}
.bd{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:99px;background:var(--elev);font-size:13px;font-weight:600}
.av{display:block;width:112px;height:112px;border-radius:50%;object-fit:cover;margin:4px auto 10px;background:#000;border:2px solid var(--bd)}
#pdp{display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--elev);color:var(--tx);font:17px inherit;font-family:inherit;padding:0 14px;margin-top:10px}
.hid{position:absolute;left:-9999px;width:1px;height:1px}
summary{min-height:44px;font-weight:600;cursor:pointer;display:flex;align-items:center}
.gh{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;font:inherit;padding:0;min-height:44px;cursor:pointer}
svg [data-a]{cursor:pointer}
#ql .li:active{background:var(--elev)}

/* Ficha visual de ejercicios */
.ex-preview{background:#080809;border:1px solid #34343a;border-radius:16px;padding:14px;margin:10px 0 14px;color:#f4f4f5}
.ex-preview .figure{display:block;width:100%;max-height:245px;margin:0 auto;background:#f3f3f4;border:1px solid #dedee2;border-radius:12px}
.ex-preview .movement{display:flex;align-items:center;gap:7px;color:#bdbdc6;font-size:13px;margin-top:8px}
.ex-preview .movement i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5148}
.anatomy-panel{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:9px;align-items:stretch;margin:12px 0}
.anatomy-views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.anatomy-card{margin:0;overflow:hidden;border:1px solid #dedee2;border-radius:12px;background:#f3f3f4}
.anatomy-map{display:block;width:100%;height:160px}
.anatomy-card figcaption{padding:7px 8px 9px;text-align:center;background:#242428;color:#fff;font-size:13px;font-weight:700}
.muscle-legend{align-self:center;padding:10px 8px;border:1px solid #3b3b42;border-radius:12px;background:#202024}
.muscle-legend>b{display:block;margin:0 0 8px;font-size:13px}
.muscle-rank{display:grid;grid-template-columns:13px 1fr;gap:6px;align-items:start;margin:8px 0}
.muscle-rank i{width:11px;height:11px;border-radius:50%;margin-top:3px}
.muscle-rank span{display:block;color:#fff;font-size:12px;line-height:1.2}
.muscle-rank small{display:block;color:#bdbdc6;font-size:10px;margin-top:2px;line-height:1.2}
.muscle-legend .hint{font-size:10px;line-height:1.25;margin:8px 0 0}
@media(max-width:360px){.anatomy-panel{grid-template-columns:minmax(0,1fr) 94px;gap:6px}.anatomy-map{height:145px}.muscle-legend{padding:8px 6px}}
.ex-preview h2{font-size:22px;margin:10px 0 5px}
.ex-preview p{margin:7px 0;color:#c4c4cc;font-size:15px}
.ex-preview .muscles{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.ex-preview .muscles span{background:#28282e;border:1px solid #41414a;border-radius:99px;padding:5px 10px;font-size:13px;color:#fff}
.ex-preview .hint{color:#9b9ba5;font-size:13px}
.ex-preview .btn{margin-top:10px}
</style>

h1::after{content:"";display:block;width:56px;height:5px;margin-top:8px;border-radius:3px;background:var(--ac);transform:skewX(-20deg)}
.card{border-left:4px solid var(--ac);border-radius:14px;background:linear-gradient(180deg,#1c1c20,#151518)}
.btn{background:linear-gradient(135deg,#43CBFF,#1C97DE);text-transform:uppercase;letter-spacing:.07em;font-weight:900;font-style:italic;box-shadow:0 6px 18px rgba(39,184,255,.22)}
.btn.sec{background:var(--elev);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.btn.ghost{background:transparent;color:var(--mu);box-shadow:none;text-transform:none;font-style:normal;letter-spacing:0;font-weight:600}
.btn.sm{letter-spacing:.04em}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:none}
nav{background:rgba(14,14,16,.97);border-top:1px solid #26262b}
nav button{position:relative;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
nav button.on{color:var(--ac);text-shadow:0 0 12px rgba(39,184,255,.55)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(39,184,255,.7))}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
#sp b{font-style:italic;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:26px}
#sp img{animation:pl 1.2s ease-in-out infinite alternate}
@keyframes pl{from{transform:scale(.96)}to{transform:scale(1.04)}}
</style>

<script>
const KEY='migym.v1';
const BASE=[["Press banca","Pecho"],["Press banca inclinado","Pecho"],["Aperturas con mancuernas","Pecho"],["Fondos en paralelas","Pecho"],["Dominadas","Espalda"],["Remo con barra","Espalda"],["Jalón al pecho","Espalda"],["Remo en polea","Espalda"],["Peso muerto","Espalda"],["Press militar","Hombro"],["Elevaciones laterales","Hombro"],["Pájaros","Hombro"],["Curl de bíceps","Brazo"],["Curl martillo","Brazo"],["Extensión de tríceps","Brazo"],["Press francés","Brazo"],["Sentadilla","Pierna"],["Prensa","Pierna"],["Zancadas","Pierna"],["Peso muerto rumano","Pierna"],["Curl femoral","Pierna"],["Extensión de cuádriceps","Pierna"],["Hip thrust","Pierna"],["Elevación de talones","Pierna"],["Plancha","Core"],["Crunch en polea","Core"],["Elevación de piernas","Core"]];
let S={workouts:[],custom:[],cur:null},E={},view='train',picking=false,store=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S.workouts=d.workouts||[];S.custom=d.custom||[];S.cur=d.cur||null;S.bw=num(d.bw);S.sex=d.sex==='m'?'m':'h';S.h=num(d.h);S.cg=d.cg||{};S.grp=d.grp||null;S.uid=d.uid||'';S.un=d.un||'';S.pf=d.pf||null;S.ph=d.ph||''}}catch(e){store=false}if(!S.uid)S.uid=rid()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){store=false}gsync();csync()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const fd=ts=>new Date(ts).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
function tm(){const s=Math.floor((Date.now()-S.cur.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(c)}
function prevSets(n){for(const w of S.workouts){const e=w.ex.find(x=>x.n===n);if(e)return e.sets}return[]}
function vTrain(){
 if(!S.cur){const l=S.workouts[0];
  return '<h1>Entrenar</h1><button class="btn" data-a="start">Empezar entreno</button>'+(l?'<p class="mu mt">Último entreno: '+fd(l.date)+', '+l.ex.length+' ejercicios.</p>':'<p class="mu mt">Aún no hay entrenos. Empieza el primero.</p>')+(store?'':'<p class="mu">Este navegador no permite guardar datos. Lo que registres se perderá al cerrar.</p>')}
 return '<h1>Entreno</h1>'+S.cur.ex.map(exCard).join('')+'<button class="btn sec" data-a="pick">Añadir ejercicio</button><div class="gap"></div><button class="btn" data-a="finish">Terminar entreno</button><button class="btn ghost" data-a="cancel">'+(E.cancel?'¿Descartar? Toca otra vez':'Descartar entreno')+'</button>'}
function exCard(e,i){const p=prevSets(e.n);
 return '<section class="card"><div class="row"><b>'+esc(e.n)+'</b><button class="x" data-a="rmex" data-i="'+i+'">Quitar</button></div>'+'<button class="btn sec sm" data-a="uni" data-i="'+i+'">'+(e.uni?'Unilateral: cada lado cuenta ×2':'Bilateral (toca para unilateral)')+'</button><div class="sr hd"><span></span><span>kg</span><span>reps</span><span></span></div>'+
 e.sets.map((s,j)=>{const q=p[j];return '<div class="sr'+(s.d?' done':'')+'"><span class="mu">'+(j+1)+'</span><input inputmode="decimal" placeholder="'+(q?q.w:'0')+'" value="'+esc(s.w)+'" data-i="'+i+'" data-j="'+j+'" data-f="w" aria-label="Peso"><input inputmode="numeric" placeholder="'+(q?q.r:'0')+'" value="'+esc(s.r)+'" data-i="'+i+'" data-j="'+j+'" data-f="r" aria-label="Repeticiones"><button class="ck" data-a="ck" data-i="'+i+'" data-j="'+j+'" aria-label="Serie hecha">✓</button></div>'}).join('')+
 '<button class="btn sec sm" data-a="addset" data-i="'+i+'">Añadir serie</button></section>'}
function vHist(){
 if(!S.workouts.length)return '<h1>Historial</h1><p class="mu">Tus entrenos guardados aparecerán aquí.</p>';
 return '<h1>Historial</h1>'+S.workouts.map(w=>{const vol=w.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
 return '<section class="card"><div class="row"><b>'+fd(w.date)+'</b><span class="mu">'+Math.round(vol)+' kg movidos</span></div>'+w.ex.map(e=>{const b=e.sets.reduce((m,s)=>(s.w>m.w||(s.w===m.w&&s.r>m.r))?s:m,e.sets[0]);return '<div class="hl"><span>'+esc(e.n)+'</span><span class="mu">'+e.sets.length+' series, mejor '+b.w+' kg × '+b.r+'</span></div>'}).join('')+'<button class="x" data-a="delw" data-id="'+w.id+'">'+(E.del===w.id?'¿Seguro? Toca otra vez':'Borrar entreno')+'</button></section>'}).join('')}
function vSet(){return '<h1>Ajustes</h1>'+'<section class="card"><b>Tu cuerpo</b><p class="mu">Se usa para calcular tus rangos.</p><input id="bw" inputmode="decimal" placeholder="Peso corporal en kg" value="'+(S.bw||'')+'"><input id="ht" inputmode="numeric" placeholder="Altura en cm" value="'+(S.h||'')+'"><select id="sx"><option value="h"'+(S.sex==='m'?'':' selected')+'>Hombre</option><option value="m"'+(S.sex==='m'?' selected':'')+'>Mujer</option></select></section><section class="card"><b>Copia de seguridad</b><p class="mu">Tus datos viven solo en este navegador. Pulsa para copiar una copia y guárdala, por ejemplo en Notas.</p><textarea id="exp" class="hid" readonly tabindex="-1" aria-hidden="true">'+esc(JSON.stringify({v:1,workouts:S.workouts,custom:S.custom,bw:S.bw,sex:S.sex,h:S.h,cg:S.cg}))+'</textarea><button class="btn sec" data-a="copy">Copiar copia</button></section><section class="card"><details><summary>Restaurar una copia</summary><p class="mu">Pega una copia. Reemplaza los datos actuales.</p><textarea id="imp" placeholder="Pega aquí"></textarea><button class="btn sec" data-a="import">Restaurar</button></details></section><p class="mu" style="font-size:13px">Versión 5. Peso y altura también se editan desde Rangos, con los tres puntos.</p>'}
const TIERS=['Cobre','Hierro','Acero','Cobalto','Jade','Rubí','Obsidiana','Titanio','Diamante','Élite'],TC=['#c4753f','#8791a0','#c3cfdd','#3b82f6','#2fbf8f','#e0343f','#9b6bff','#8ea4b8','#36c5f0','#ff8c42','#ffc933'],GROUPS=['Pecho','Espalda','Hombro','Brazo','Pierna','Core'],BWL=['Fondos en paralelas','Dominadas'];
const K={'Press banca':1.25,'Press banca inclinado':1,'Aperturas con mancuernas':.2,'Fondos en paralelas':1.5,'Dominadas':1.3,'Remo con barra':1,'Jalón al pecho':.95,'Remo en polea':.95,'Peso muerto':1.75,'Press militar':.8,'Elevaciones laterales':.1,'Pájaros':.1,'Curl de bíceps':.5,'Curl martillo':.45,'Extensión de tríceps':.5,'Press francés':.5,'Sentadilla':1.5,'Prensa':3,'Zancadas':.9,'Peso muerto rumano':1.4,'Curl femoral':.6,'Extensión de cuádriceps':.9,'Hip thrust':1.75,'Elevación de talones':1.6,'Crunch en polea':.8};
function lvl(n){const k=K[n];if(!k||!S.bw)return null;let best=0;for(const w of S.workouts){const e=w.ex.find(x=>x.n===n);if(e)for(const s of e.sets){const ld=(BWL.includes(n)?S.bw:0)+s.w,e1=ld*(1+Math.min(s.r,12)/30);if(e1>best)best=e1}}if(!best)return null;return Math.max(0,Math.min(30,9+Math.log(best/S.bw/(k*(S.sex==='m'?.65:1)))/Math.log(1.07)))}
function glv(){const o={};for(const g of GROUPS){const l=[];for(const x of BASE)if(x[1]===g){const v=lvl(x[0]);if(v!==null)l.push(v)}l.sort((a,b)=>b-a);const t=l.slice(0,2);o[g]=t.length?t.reduce((a,b)=>a+b,0)/t.length:null}return o}
const nm=v=>v===null?'Sin rango':v>=30?'Leyenda':TIERS[Math.floor(v/3)]+' '+(Math.floor(v%3)+1),col=v=>v===null?'#4a4a54':TC[Math.min(10,Math.floor(v/3))];
function fig(x,back,g){const f=n=>col(g[n]),r=(a,b,c,d,e,n)=>'<rect x="'+(x+a)+'" y="'+b+'" width="'+c+'" height="'+d+'" rx="'+e+'" fill="'+f(n)+'"/>',el=(a,n)=>'<ellipse cx="'+(x+a)+'" cy="36" rx="10" ry="8" fill="'+f(n)+'"/>';return '<circle cx="'+x+'" cy="16" r="11" fill="#3a3a40"/>'+r(-14,31,28,back?44:22,7,back?'Espalda':'Pecho')+(back?'':r(-12,55,24,26,6,'Core'))+el(-23,'Hombro')+el(23,'Hombro')+r(-34,46,10,44,5,'Brazo')+r(24,46,10,44,5,'Brazo')+r(-13,84,12,66,6,'Pierna')+r(1,84,12,66,6,'Pierna')}
function vRank(){if(!S.bw)return '<h1>Rangos</h1><section class="card"><p>Necesito tu peso corporal para calcular tus rangos.</p><button class="btn" data-v="set">Ir a Ajustes</button></section>';const g=glv();return '<h1>Rangos</h1><svg viewBox="0 0 220 172" width="100%" role="img" aria-label="Rango por zona del cuerpo">'+fig(55,0,g)+fig(165,1,g)+'<text x="55" y="168" fill="#A1A1AA" font-size="11" text-anchor="middle">Frente</text><text x="165" y="168" fill="#A1A1AA" font-size="11" text-anchor="middle">Espalda</text></svg>'+GROUPS.map(n=>{const v=g[n];return '<section class="card"><div class="row"><b>'+n+'</b><b style="color:'+(v===null?'var(--mu)':col(v))+'">'+nm(v)+'</b></div><div class="bar"><i style="width:'+(v===null?0:Math.round(v%1*100))+'%;background:'+col(v)+'"></i></div>'+(v===null?'<p class="mu" style="margin:8px 0 0;font-size:15px">Registra un ejercicio de esta zona.</p>':'')+'</section>'}).join('')+'<p class="mu" style="font-size:14px">Rangos aproximados: tu mejor serie estimada frente a tu peso corporal. La barra muestra lo que falta para el siguiente nivel.</p>'}
const FR=[['Pecho','M51 40C56 38 61 39 65 42C68 46 68 54 64 60C60 64 55 65 51 63Z'],['Hombro','M66 40C72 37 79 40 81 47C82 53 80 58 77 62C74 58 71 54 69 50C67 47 66 44 66 40Z'],['Core','M51 66C56 65 61 66 62 68L62 96C61 103 56 108 51 109Z'],['Core','M64 68C67 70 69 78 69 88C69 96 67 102 64 104Z'],['Brazo','M78 64C82 62 85 66 85 73C85 80 83 86 81 90L74 88C75 80 76 72 78 64Z'],['Brazo','M75 92L81 93C84 102 85 112 83 122L77 123C75 112 74 102 75 92Z'],['Pierna','M51 122L67 120C70 134 68 152 63 166L54 166C52 150 51 136 51 122Z'],['Pierna','M54 170L63 170C65 182 63 198 60 212L56 212C54 198 53 184 54 170Z']];
const BK=[['Espalda','M51 32L60 36C64 40 66 44 64 48L51 58Z'],['Espalda','M51 60L64 50C68 54 69 62 67 72C65 84 60 92 56 96L51 98Z'],FR[1],FR[4],FR[5],['Pierna','M51 102C58 100 66 103 68 112C68 120 60 124 51 123Z'],['Pierna','M51 126L67 124C70 138 68 152 63 164L54 164C52 150 51 138 51 126Z'],['Pierna','M54 168C58 166 64 168 64 176C65 190 62 202 59 212L56 212C54 200 52 186 54 168Z']];
const NB=['M45 25L55 25L56 34L44 34Z','M76 126C81 125 85 129 84 134C83 139 79 141 76 139Z','M54 214L62 214L65 222L52 222Z'],NF=NB.concat(['M51 110L64 106C67 110 68 114 67 118L51 120Z']),FO='<path d="M51 77H62M51 87H62M51 97H62" stroke="#0E0E10" stroke-width="1.2" fill="none"/>';
function bestSet(n){let b=null,m=0;for(const w of S.workouts){const e=w.ex.find(x=>x.n===n);if(e)for(const s of e.sets){const f=e.uni?2:1,v=((BWL.includes(n)?S.bw:0)+s.w*f)*(1+Math.min(s.r,12)/30);if(v>m){m=v;b={w:s.w*f,r:s.r}}}}return b}
function lvl(n){const k=K[n],b=bestSet(n);if(!k||!S.bw||!b)return null;const e1=((BWL.includes(n)?S.bw:0)+b.w)*(1+Math.min(b.r,12)/30);return Math.max(0,Math.min(30,9+Math.log(e1/S.bw/(k*(S.sex==='m'?.65:1)))/Math.log(1.07)))}
const pc=v=>v===null?0:v>=30?100:Math.round(v%1*100);
function exList(gp){return BASE.filter(x=>x[1]===gp).map(x=>{const b=bestSet(x[0]),v=lvl(x[0]);return '<div class="hl"><span>'+esc(x[0])+'</span><span class="mu">'+(b?(BWL.includes(x[0])&&!b.w?'Peso corporal':b.w+' kg')+' × '+b.r+(v!==null?', '+nm(v):''):'Sin registros')+'</span></div>'}).join('')}
function fig(ox,L,N,g,ov){const half=m=>'<g'+(m?' transform="translate(100,0) scale(-1,1)"':'')+'>'+N.map(d=>'<path d="'+d+'" fill="#2a2a30"/>').join('')+L.map(p=>'<path data-a="grp" data-g="'+p[0]+'" d="'+p[1]+'" fill="'+col(g[p[0]])+'" stroke="#0E0E10" stroke-width="1.2" stroke-linejoin="round"/>').join('')+ov+'</g>';return '<g transform="translate('+ox+',0)"><circle cx="50" cy="15" r="11" fill="#2a2a30"/>'+half(0)+half(1)+'</g>'}
function vRank(){if(!S.bw)return '<h1>Rangos</h1><section class="card"><p>Necesito tu peso corporal para calcular tus rangos.</p><button class="btn" data-v="set">Ir a Ajustes</button></section>';const g=glv();return '<h1>Rangos</h1><svg viewBox="0 0 210 240" width="100%" role="img" aria-label="Rango por zona del cuerpo">'+fig(0,FR,NF,g,FO)+fig(110,BK,NB,g,'')+'<text x="50" y="236" fill="#A1A1AA" font-size="10" text-anchor="middle">Frente</text><text x="160" y="236" fill="#A1A1AA" font-size="10" text-anchor="middle">Espalda</text></svg>'+GROUPS.map(n=>{const v=g[n],o=E.g===n;return '<section class="card"><button class="gh" data-a="grp" data-g="'+n+'"><b>'+n+'</b><span><b style="color:'+(v===null?'var(--mu)':col(v))+'">'+nm(v)+'</b> <span class="mu">'+(o?'−':'+')+'</span></span></button><div class="bar"><i style="width:'+pc(v)+'%;background:'+col(v)+'"></i></div>'+(o?exList(n):'')+'</section>'}).join('')+'<p class="mu" style="font-size:14px">Toca una zona para ver tus ejercicios. Rangos aproximados: tu mejor serie estimada frente a tu peso corporal. La barra muestra lo que falta para el siguiente nivel.</p>'}
const SIL='M50 26L54 26L56 33C62 35 70 36 76 38C82 40 86 46 87 54C88 64 88 76 87 86C87 96 89 108 87 118L91 132C91 138 84 140 80 136L78 120C76 108 75 96 75 86C75 76 74 66 70 62C68 74 66 88 65 98C66 106 68 112 69 118C71 134 70 152 66 166C67 176 66 190 62 212L66 222L52 224L54 212C53 196 53 186 53 176L53 166C52 152 52 136 50 120Z';
const DL=['Hombro','M70 40C77 38 84 42 86 50C87 58 84 64 80 68C76 62 72 56 70 50C69 46 69 43 70 40Z','pd'],BI=['Brazo','M76 66C80 64 84 67 85 76C85 82 83 88 80 90L75 87C75 80 75 72 76 66Z','pv'],FA=['Brazo','M76 92L83 91C86 100 87 110 85 120L79 120C77 110 76 100 76 92Z','pv'];
const M1=[['Pecho','M51 40C56 38 63 39 68 43C72 47 70 56 64 61C59 64 54 64 51 62Z','pd'],DL,['Espalda','M54 30C58 32 63 35 68 38L64 41C60 38 57 36 54 33Z','pd'],['Core','M51 66C55 65 59 66 61 67L61 74C57 75 54 75 51 74Z','pv'],['Core','M51 76C55 75 59 76 61 77L61 84C57 85 54 85 51 84Z','pv'],['Core','M51 86C55 85 59 86 60 87L60 94C57 95 54 95 51 94Z','pv'],['Core','M51 96C54 95 58 96 59 97L58 105C55 107 53 107 51 107Z','pv'],['Core','M63 67C67 70 69 80 68 92C67 100 65 105 62 107L62 70Z','pd'],BI,FA,['Pierna','M56 124C59 122 62 124 63 130C64 142 62 154 59 164L56 164C55 150 55 136 56 124Z','pv'],['Pierna','M62 124C67 124 69 128 69 136C69 148 67 158 64 166L61 164C63 154 64 140 62 124Z','pv'],['Pierna','M52 130C54 128 55 130 55 136C55 146 57 156 58 164C55 168 52 166 52 160Z','pv'],['Pierna','M55 172L62 171C64 182 63 196 60 210L56 210C54 196 54 184 55 172Z','pv']];
const M2=[['Espalda','M51 30L58 34C64 37 68 40 70 44L63 52L51 62Z','pd'],['Espalda','M52 64L63 54C68 58 69 68 67 78C65 88 61 96 57 100L52 100Z','pd'],['Espalda','M52 102L57 100C59 106 59 112 57 117L52 118Z','pv'],DL,BI,FA,['Pierna','M51 118C59 116 67 120 69 129C68 137 60 140 51 139Z','pd'],['Pierna','M62 142C67 142 69 148 68 156C67 162 65 166 63 168L60 166C62 158 62 150 62 142Z','pv'],['Pierna','M52 142C58 141 61 143 61 150C61 158 60 164 58 168L53 168C52 160 52 150 52 142Z','pv'],['Pierna','M53 172C56 170 59 171 60 176C60 186 58 196 56 204L54 204C52 192 52 182 53 172Z','pv'],['Pierna','M61 172C64 172 65 176 65 184C64 194 62 202 60 206L58 204C60 192 61 182 61 172Z','pv']];
